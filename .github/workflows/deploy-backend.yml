name: Deploy Render backend

# Необязательный авто-деплой: создайте Deploy Hook в Render → Settings →
# Deploy Hook, добавьте его URL в GitHub Secrets как RENDER_DEPLOY_HOOK.
# Если секрет не задан, workflow просто завершится без ошибки.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: render-backend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          else
            echo "RENDER_DEPLOY_HOOK is not configured; skipping automatic deploy."
          fi
